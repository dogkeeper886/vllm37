# a perplexity.py measure result, as a path relative to this file, or empty to
# give gate --calibration instead
calibration: calibration/qwen3.5-0.8b.json

# a number from 0, in multiples of the calibration's decodeGap
decode_gap_factor: 10

# a perplexity, above 1
copy_max: 1.5

# a number, shuffledPerplexity over perplexity
shuffle_min_ratio: 10

# a fraction of the lowest perplexity, or empty for no ties
tie: 1.0e-6
