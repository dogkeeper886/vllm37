# Every prompt a test sends, and every question the agent judge asks.
# Nothing else in this folder may hold prompt or judge text: tests name a prompt,
# lib/prompts.ts is the only reader, and a prompt names its own judge question,
# so no test can pick a weaker one or none.
#
# The three prompts, their texts and the judge question are ollama37's
# (cicd/tests/prompts.yaml), so a reply here and a reply there answer the same task.
#
# Point VLLM37_PROMPTS at another file to run an experiment without a code change.
#
# A prompt has:
#   text | text_file   the prompt, inline or from a file beside this one
#   task               appended after the text, when the text is material to work on
#   expect             a string the reply must contain (checked by lib/check.ts)
#   reject             strings the reply must not contain, case-insensitive
#   options            request options under Ollama's names; lib/vllm.ts sends
#                      temperature and seed as they are and num_predict as max_tokens
#   judge              the name of a question under `judges` (each names the answer that passes)

prompts:
  # Does the model load and answer in language? A wrong answer still passes.
  short-answer:
    text: "What is 2+2? Answer in one short sentence."
    options: { temperature: 0, seed: 0, num_predict: 400 }
    judge: broken

  # Speed on a realistic prompt (~870 tokens in, 100 out): Lincoln's second
  # inaugural address (1865).
  speech-rewrite:
    text_file: prompts/speech.txt
    task: >-
      Rewrite the speech above in plainer English. Cut every verbal tic and filler
      word. Put each sentence's main character first. Turn each negative sentence
      affirmative. Replace any phrase that one exact word can replace. Output only
      the rewritten speech.
    options: { temperature: 0, seed: 42, num_predict: 100 }
    judge: broken

  # Speed over a long context (~8k tokens in, 100 out): Washington's Farewell
  # Address (1796), from the Avalon Project at Yale Law School.
  farewell-summary:
    text_file: prompts/farewell.txt
    task: >-
      Summarize the address above in plain English. Keep its main warnings and advice
      in the order it gives them. Output only the summary.
    options: { temperature: 0, seed: 42, num_predict: 100 }
    judge: broken

# A throwaway question that starts the judge agent and loads its model before the
# first real one, so a cold start is not charged to a reply.
warmup: "Reply with exactly: ok"

judges:
  # Every judge question names the answer that passes, so a question can be asked
  # either way round without the code guessing.
  broken:
    pass: "no"
    question: |
      Is this text garbage, crash output, or words in random order? yes or no

      "{reply}"
