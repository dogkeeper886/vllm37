services:
  vllm:
    image: vllm37-local:latest
    container_name: vllm37
    runtime: nvidia
    # bytes, or a size with b, k, m or g, such as 4g
    shm_size: '4g'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # all, or a whole number of GPUs from 1
              count: all
              capabilities: [gpu]
    # HOST_UID and HOST_GID: a user id and a group id
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      # HOST:CONTAINER TCP ports; the container side is the server's --port, 8000
      - "8000:8000"
    volumes:
      # HF_HOME: a directory
      - ${HF_HOME:-~/.cache/huggingface}:/cache/huggingface
      # VLLM_LOG_DIR: a directory
      - ${VLLM_LOG_DIR:-/tmp/vllm-logs}:/var/log/vllm
    environment:
      # a directory in the container: the cache volume's target
      - HF_HOME=/cache/huggingface
      # a directory in the container that HOST_UID can write
      - HOME=/tmp
      # VERSION, WARN, INFO or TRACE
      - NCCL_DEBUG=INFO
      # a file path in the container; %h is the host name, %p the process id
      - NCCL_DEBUG_FILE=/var/log/vllm/nccl-%h-%p.log
      # 0 or 1
      - VLLM_K80_TRACE=${VLLM_K80_TRACE:-0}
      # XFORMERS or TORCH_SDPA
      - VLLM_ATTENTION_BACKEND=${VLLM_ATTENTION_BACKEND:-XFORMERS}
    command:
      - "--model"
      # MODEL: a Hugging Face repo id or a local path
      - "${MODEL:-TinyLlama/TinyLlama-1.1B-Chat-v1.0}"
      - "--dtype"
      # DTYPE: float32 or half
      - "${DTYPE:-float32}"
      # present: eager only; absent: CUDA graphs and eager
      - "--enforce-eager"
      - "--tensor-parallel-size"
      # TP_SIZE: whole number from 1, at most the host's dies, dividing the
      # model's attention heads
      - "${TP_SIZE:-1}"
      - "--max-model-len"
      # MAX_MODEL_LEN: tokens, up to the model's context length
      - "${MAX_MODEL_LEN:-2048}"
      - "--gpu-memory-utilization"
      # GPU_MEM_UTIL: a fraction of each die's memory, up to 1
      - "${GPU_MEM_UTIL:-0.85}"
      - "--swap-space"
      # GiB per die, from 0; times the dies, below 70 % of host memory
      - "0"
    # no, always, on-failure[:N] or unless-stopped
    restart: unless-stopped
