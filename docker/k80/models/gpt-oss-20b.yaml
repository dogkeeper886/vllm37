# a Hugging Face repo id or a local path
model: openai/gpt-oss-20b
# float32 or half
dtype: float32
# whole number from 1; with pipeline-parallel-size, at most the host's dies
tensor-parallel-size: 2
# tokens, up to the model's context length
max-model-len: 8192
# a fraction of each die's memory, up to 1
gpu-memory-utilization: 0.92
# whole number from 1
max-num-seqs: 32
