name: "Test: arrival"

# Two calls sent together, then the second sent once the first has streamed 20
# tokens: does the server still answer when a call joins a running one?
# Its own input is stagger, and arrival needs two calls; every other input keeps
# its default in k80-test.yml.

on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/k80-test.yml
    with:
      test: arrival
      calls: "2"
      stagger: "0,20"
