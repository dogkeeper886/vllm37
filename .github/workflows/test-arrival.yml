name: "Test: arrival"

on:
  workflow_dispatch:
    inputs:
      stagger:
        description: "Token counts to run, comma separated; 0 sends the calls together (empty = repository variable TEST_STAGGER)"
        default: ""
        type: string
      calls:
        description: "How many calls arrive (empty = repository variable TEST_ARRIVAL_CALLS)"
        default: ""
        type: string

jobs:
  test:
    name: arrival
    runs-on: [self-hosted, vllm]
    concurrency:
      group: k80-hardware
      cancel-in-progress: false
    # whole minutes from 1
    timeout-minutes: 60
    env:
      # URL of an ollama server
      JUDGE_BASE_URL: ${{ vars.JUDGE_BASE_URL || 'http://localhost:11434' }}
      # a model name on the JUDGE_BASE_URL server, as ollama lists it
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'ornith-1.5:9b' }}
      # a host directory path
      VLLM_LOG_DIR: /tmp/k80-ci-logs
      # whole °C from 1, below TEST_STOP_TEMP
      TEST_START_TEMP: ${{ vars.TEST_START_TEMP || '60' }}
      # whole °C above TEST_START_TEMP
      TEST_STOP_TEMP: ${{ vars.TEST_STOP_TEMP || '80' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: ./.github/actions/test
        with:
          test: arrival
          # token counts, whole numbers from 0, comma separated
          stagger: ${{ inputs.stagger || vars.TEST_STAGGER || '0,20' }}
          # whole numbers from 1, comma separated
          calls: ${{ inputs.calls || vars.TEST_ARRIVAL_CALLS || '2' }}
          # docker or local; empty = docker
          server: ${{ vars.TEST_SERVER }}
          # Hugging Face model id; empty = the qwen3-0.6b profile's
          model: ${{ vars.TEST_MODEL }}
          # whole number of tokens; empty = the qwen3-0.6b profile's
          max_model_len: ${{ vars.TEST_MAX_MODEL_LEN }}
      - uses: ./.github/actions/test-end
        if: always()
