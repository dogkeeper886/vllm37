name: "Test"

# The steps every test runs, written once. The five test-*.yml files call this
# with their own input; run it by hand to give any input any value.
#
# One question for every run: under the condition the inputs set, does vllm37
# still give a real answer and not garbage? Pass or fail comes from the replies
# alone; speed and memory are reported, not ruled on.
#
#   prepare   checkout, host, node
#   runtime   which build is on the runner (docker/k80/ci/runtime.sh; never builds)
#   service   start the server, later stop it and give the GPUs back
#   test      docker/k80/ci/tests/test.ts: requests in, replies out
#   report    judge every reply, write the table, set the exit code
#
# The run summary is the host, the runtime, the server, then the test's table.

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Name shown in the report"
        default: "test"
        type: string
      server:
        description: "Build to serve: docker = the image on the runner, local = the host build"
        default: "docker"
        type: choice
        options: ["docker", "local"]
      model:
        description: "Hugging Face model id"
        default: "Qwen/Qwen3-0.6B"
        type: string
      dtype:
        description: "Weight and KV cache dtype"
        default: "float32"
        type: choice
        options: ["float32", "half"]
      dies:
        description: "Dies (tensor parallel size). Never more than 2: four have halted this machine"
        default: "1"
        type: choice
        options: ["1", "2"]
      max_model_len:
        description: "Context length in tokens"
        default: "12288"
        type: string
      prompt:
        description: "Prompt from prompts.yaml; a comma list runs each"
        default: "speech-rewrite"
        type: string
      calls:
        description: "Calls that send the prompt at once; a comma list runs each"
        default: "1"
        type: string
      stagger:
        description: "Tokens a call has streamed before the next is sent (0 = together); a comma list runs each"
        default: "0"
        type: string
  workflow_call:
    inputs:
      test: { required: true, type: string }
      server: { required: false, default: "docker", type: string }
      model: { required: false, default: "Qwen/Qwen3-0.6B", type: string }
      dtype: { required: false, default: "float32", type: string }
      dies: { required: false, default: "1", type: string }
      max_model_len: { required: false, default: "12288", type: string }
      prompt: { required: false, default: "speech-rewrite", type: string }
      calls: { required: false, default: "1", type: string }
      stagger: { required: false, default: "0", type: string }

jobs:
  test:
    name: ${{ inputs.test }} (${{ inputs.server }}, ${{ inputs.dtype }}, ${{ inputs.dies }} die)
    runs-on: [self-hosted, vllm]
    # One job at a time on the cards, whichever workflow it belongs to.
    concurrency:
      group: k80-hardware
      cancel-in-progress: false
    # The server start, the calls and the judge. No build: a run never builds.
    timeout-minutes: 60
    env:
      # The judge: a model on an ollama server. A repository variable of the same
      # name overrides either default.
      JUDGE_BASE_URL: ${{ vars.JUDGE_BASE_URL || 'http://localhost:11434' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'ornith-1.5:9b' }}
      VLLM_LOG_DIR: /tmp/k80-ci-logs
      SERVER: ${{ inputs.server }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: ./.github/actions/identify-host
      - uses: ./.github/actions/setup-tests
      - name: Runtime
        run: docker/k80/ci/runtime.sh "$SERVER"
      # Before the GPUs are taken: a run with no judge would test nothing.
      - name: Judge ready
        working-directory: docker/k80/ci/tests
        run: npx tsx report.ts --ready
      - name: Service start
        env:
          MODEL: ${{ inputs.model }}
          DTYPE: ${{ inputs.dtype }}
          TP_SIZE: ${{ inputs.dies }}
          MAX_MODEL_LEN: ${{ inputs.max_model_len }}
        run: docker/k80/ci/service-start.sh "$SERVER"
      - name: Test
        working-directory: docker/k80/ci/tests
        env:
          TEST: ${{ inputs.test }}
          PROMPT: ${{ inputs.prompt }}
          CALLS: ${{ inputs.calls }}
          STAGGER: ${{ inputs.stagger }}
        run: npx tsx test.ts --test "$TEST" --prompt "$PROMPT" --calls "$CALLS" --stagger "$STAGGER" --output results/replies.json
      # Whatever happened above, cancel and timeout included: the cards go back.
      - name: Service stop
        if: always()
        run: docker/k80/ci/service-stop.sh
      - name: Judge and report
        if: always()
        working-directory: docker/k80/ci/tests
        env:
          TEST: ${{ inputs.test }}
        run: npx tsx report.ts --test "$TEST" --input results/replies.json --output results/report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ inputs.test }}-${{ inputs.server }}-${{ inputs.dtype }}-${{ inputs.dies }}die-report
          path: docker/k80/ci/tests/results/
          if-no-files-found: warn
