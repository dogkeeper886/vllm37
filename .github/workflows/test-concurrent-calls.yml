name: "Test: concurrent calls"

# One call, then two calls sent together: does the server still answer, and
# what is the total decode rate of each?
# Its own input is calls; every other input keeps its default in k80-test.yml.

on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/k80-test.yml
    with:
      test: concurrent-calls
      calls: "1,2"
