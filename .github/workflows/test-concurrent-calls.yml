name: "Test: concurrent calls"

# Each count in `calls` sends that many calls at once: does the server still
# answer, and what is the total decode rate of each?
# Values come from the Run form, else the repository variable, else the value
# written here as a last resort.

on:
  workflow_dispatch:
    inputs:
      calls:
        description: "Call counts to run, comma separated (empty = repository variable TEST_CALLS)"
        default: ""
        type: string

jobs:
  test:
    name: concurrent-calls
    runs-on: [self-hosted, vllm]
    # One job at a time on the cards, whichever workflow it belongs to.
    concurrency:
      group: k80-hardware
      cancel-in-progress: false
    # The server start, the calls and the judge. No build: a run never builds.
    timeout-minutes: 60
    env:
      # The judge: a model on an ollama server.
      JUDGE_BASE_URL: ${{ vars.JUDGE_BASE_URL || 'http://localhost:11434' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'ornith-1.5:9b' }}
      VLLM_LOG_DIR: /tmp/k80-ci-logs
      # Each option starts once its dies read TEST_START_TEMP °C or less; a die
      # at TEST_STOP_TEMP °C, or a throttle flag, makes its tok/s invalid.
      TEST_START_TEMP: ${{ vars.TEST_START_TEMP || '50' }}
      TEST_STOP_TEMP: ${{ vars.TEST_STOP_TEMP || '80' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: ./.github/actions/test
        with:
          test: concurrent-calls
          calls: ${{ inputs.calls || vars.TEST_CALLS || '1,2' }}
          # Shared settings: repository variables; empty takes the default in
          # docker/k80/ci/service-start.sh.
          server: ${{ vars.TEST_SERVER }}
          model: ${{ vars.TEST_MODEL }}
          max_model_len: ${{ vars.TEST_MAX_MODEL_LEN }}
      # Whatever happened above, cancel and timeout included: the cards go back.
      - uses: ./.github/actions/test-end
        if: always()
