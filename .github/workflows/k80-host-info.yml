name: K80 Host Info

# What the self-hosted K80 runner is: its GPUs, driver, CUDA toolkit and OS.
# Read-only: no GPU compute, no docker, no tensor parallelism. Safe at any time.
# The run summary is two tables: the host, then the toolchain.

on:
  workflow_dispatch:

# No concurrency group: this workflow makes no GPU calls (pure nvidia-smi /
# nvcc / OS-info read), so it has no business waiting on the k80-hardware
# lock when a long compute job is running.

jobs:
  info:
    name: GPU + toolkit + OS info
    runs-on: [self-hosted, vllm]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: ./.github/actions/identify-host

      - name: Toolchain
        run: |
          NVCC=$( (nvcc --version 2>/dev/null || /usr/local/cuda/bin/nvcc --version 2>/dev/null) | sed -n 's/.*release \([0-9.]*\).*/\1/p' | head -1)
          {
            echo "### Toolchain"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| nvcc | ${NVCC:-not found} |"
            echo "| CUDA installs | $(ls -d /usr/local/cuda* 2>/dev/null | tr '\n' ' ') |"
            echo "| Docker | $(docker --version 2>/dev/null || echo 'not found') |"
            echo "| OS | $(. /etc/os-release && echo "$PRETTY_NAME") |"
            echo "| Kernel | $(uname -r) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: nvidia-smi
        run: nvidia-smi || true
