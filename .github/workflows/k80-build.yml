name: K80 Docker Build

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Force rebuild without Docker layer cache"
        required: false
        default: false
        type: boolean
      rebuild_builder:
        description: "Rebuild the builder image from scratch (~120 min)"
        required: false
        default: false
        type: boolean
      builder_image:
        description: "Builder image to build on (default pulls dogkeeper886/vllm37-builder when missing)"
        required: false
        default: "vllm37-builder:latest"
        type: string
  workflow_call:
    inputs:
      no_cache:
        required: false
        default: false
        type: boolean
      rebuild_builder:
        required: false
        default: false
        type: boolean
      builder_image:
        required: false
        # an image name on the runner; vllm37-builder:latest is pulled when missing
        default: "vllm37-builder:latest"
        type: string
    outputs:
      result:
        description: "Build result"
        value: ${{ jobs.build.outputs.result }}

concurrency:
  group: k80-hardware
  cancel-in-progress: false

jobs:
  build:
    name: Build vllm37-local image
    runs-on: [self-hosted, vllm]
    # both whole minutes from 1
    timeout-minutes: ${{ inputs.rebuild_builder && 180 || 60 }}
    env:
      # an image name on the runner; vllm37-builder:latest is pulled when missing
      BUILDER_IMAGE: ${{ inputs.builder_image || 'vllm37-builder:latest' }}
    outputs:
      result: ${{ steps.build-local.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Ensure builder image exists
        working-directory: docker/k80
        run: |
          if [ "${{ inputs.rebuild_builder }}" = "true" ]; then
            echo "rebuild_builder=true — building $BUILDER_IMAGE from source"
            make build-builder BUILDER_IMAGE="$BUILDER_IMAGE"
          else
            ci/ensure-builder.sh "$BUILDER_IMAGE"
          fi

      - name: Build runtime image (local source)
        id: build-local
        working-directory: docker/k80
        run: |
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            make build-local-no-cache BUILDER_IMAGE="$BUILDER_IMAGE"
          else
            make build-local BUILDER_IMAGE="$BUILDER_IMAGE"
          fi

      - name: Report the image
        if: always()
        working-directory: docker/k80
        run: |
          if ci/runtime.sh docker; then
            {
              echo "| Builder image | \`$BUILDER_IMAGE\` |"
              echo "| Build step | ${{ steps.build-local.outcome }} |"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The build step ended with: ${{ steps.build-local.outcome }}." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
