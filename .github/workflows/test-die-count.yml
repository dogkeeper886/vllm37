name: "Test: die count"

# One die, then both dies of one board (tensor parallel size 2): does the server
# still answer, and what memory and speed does each hold?
# Its own input is dies, a server setting, so each value is a job with a server
# of its own; every other input keeps its default in k80-test.yml.

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        dies: ["1", "2"]
    uses: ./.github/workflows/k80-test.yml
    with:
      test: die-count
      dies: ${{ matrix.dies }}
