name: "Test: request length"

# A short prompt (~870 tokens), then a long one (~7,300 tokens): does the server
# still answer, and what is the prefill and decode speed of each?
# Its own input is prompt; every other input keeps its default in k80-test.yml.

on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/k80-test.yml
    with:
      test: request-length
      prompt: "speech-rewrite,farewell-summary"
