name: "Test: request length"

# A short prompt (~870 tokens), then a long one (~8k tokens): prefill and decode
# speed of each.
# Column "Request length" of the use-case table (speech-rewrite, farewell-summary); the other columns stay on
# its first row: Qwen/Qwen3-0.6B, float32, 1 die, 1 call, speech-rewrite.
# Wiring only: the test is docker/k80/ci/tests/request-length.ts, which takes the GPUs,
# serves, gives them back, judges every reply and fails on anything unjudged.
# The run summary is the host, then the test's own table.

on:
  workflow_dispatch:

concurrency:
  group: k80-hardware
  cancel-in-progress: false

jobs:
  test:
    name: request length (speech-rewrite, farewell-summary)
    runs-on: [self-hosted, vllm]
    # An image rebuild (~15 min), the server starts, the calls and the judge.
    timeout-minutes: 60
    env:
      # The judge: a model on an ollama server. A repository variable of the same
      # name overrides either default.
      JUDGE_BASE_URL: ${{ vars.JUDGE_BASE_URL || 'http://localhost:11434' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'ornith-1.5:9b' }}
      VLLM_LOG_DIR: /tmp/k80-ci-logs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: ./.github/actions/identify-host
      - uses: ./.github/actions/setup-tests
      - name: Ensure runtime image matches branch SHA
        working-directory: docker/k80
        run: ci/ensure-runtime.sh
      - name: Run
        working-directory: docker/k80/ci/tests
        run: npx tsx request-length.ts --output results/request-length.json
      # runTest restores the GPU itself, but a cancelled or timed-out job kills it
      # first; this gives the cards back whatever happened above.
      - name: Restore GPU
        if: always()
        run: docker/k80/ci/gpu-restore.sh
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: request-length-report
          path: docker/k80/ci/tests/results/
          if-no-files-found: warn
