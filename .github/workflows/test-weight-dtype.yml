name: "Test: weight dtype"

# FP32 weights, then FP16-stored weights with FP32 math: does the server still
# answer, and what memory and speed does each hold?
# Its own input is dtype, a server setting, so each value is a job with a server
# of its own; every other input keeps its default in k80-test.yml.

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        dtype: ["float32", "half"]
    uses: ./.github/workflows/k80-test.yml
    with:
      test: weight-dtype
      dtype: ${{ matrix.dtype }}
