name: "Test: weight dtype"

on:
  workflow_dispatch:
    inputs:
      dtype:
        description: "Weight dtypes to run, comma separated; one job each (empty = repository variable TEST_DTYPES)"
        default: ""
        type: string

jobs:
  values:
    name: dtype list
    runs-on: [self-hosted, vllm]
    outputs:
      dtype: ${{ steps.list.outputs.dtype }}
    steps:
      - id: list
        env:
          # auto, half, float16, float or float32, comma separated
          DTYPE: ${{ inputs.dtype || vars.TEST_DTYPES || 'float32,half' }}
        run: |
          DTYPE=${DTYPE// /}
          echo "dtype=[\"${DTYPE//,/\",\"}\"]" >> "$GITHUB_OUTPUT"
  test:
    needs: values
    strategy:
      # whole number from 1
      max-parallel: 1
      fail-fast: false
      matrix:
        dtype: ${{ fromJSON(needs.values.outputs.dtype) }}
    name: weight-dtype (${{ matrix.dtype }})
    runs-on: [self-hosted, vllm]
    concurrency:
      group: k80-hardware
      cancel-in-progress: false
    # whole minutes from 1
    timeout-minutes: 60
    env:
      # URL of an ollama server
      JUDGE_BASE_URL: ${{ vars.JUDGE_BASE_URL || 'http://localhost:11434' }}
      # a model name on the JUDGE_BASE_URL server, as ollama lists it
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'ornith-1.5:9b' }}
      # a host directory path
      VLLM_LOG_DIR: /tmp/k80-ci-logs
      # whole °C from 1, below TEST_STOP_TEMP
      TEST_START_TEMP: ${{ vars.TEST_START_TEMP || '60' }}
      # whole °C above TEST_START_TEMP
      TEST_STOP_TEMP: ${{ vars.TEST_STOP_TEMP || '80' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: ./.github/actions/test
        with:
          test: weight-dtype
          dtype: ${{ matrix.dtype }}
          # docker or local; empty = docker
          server: ${{ vars.TEST_SERVER }}
          # Hugging Face model id; empty = the qwen3-0.6b profile's
          model: ${{ vars.TEST_MODEL }}
          # whole number of tokens; empty = the qwen3-0.6b profile's
          max_model_len: ${{ vars.TEST_MAX_MODEL_LEN }}
      - uses: ./.github/actions/test-end
        if: always()
