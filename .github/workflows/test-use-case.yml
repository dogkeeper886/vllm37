name: "Test: use case"

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Profiles from docker/k80/models/ to run, comma separated; one job each (empty = repository variable TEST_PROFILES, else every profile but qwen3-0.6b and qwen3.5-0.8b)"
        default: ""
        type: string
      server:
        description: "Build to serve: docker = the image on the runner, local = the host build's working tree (empty = repository variable TEST_SERVER)"
        default: ""
        type: string

jobs:
  plan:
    name: plan
    runs-on: [self-hosted, vllm]
    # whole minutes from 1
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.list.outputs.profiles }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - id: list
        env:
          # profile names in docker/k80/models/, comma separated; empty = every profile but EXCLUDE
          PROFILES: ${{ inputs.profiles || vars.TEST_PROFILES }}
          # docker or local; empty = docker
          SERVER: ${{ inputs.server || vars.TEST_SERVER }}
        run: |
          set -euo pipefail
          ALL=$(cd docker/k80/models && ls *.yaml | sed 's/\.yaml$//' | tr '\n' ' ')
          # profile names in docker/k80/models/, space separated; empty leaves none out
          EXCLUDE="qwen3-0.6b qwen3.5-0.8b"
          DEFAULT=" $ALL "
          for p in $EXCLUDE; do DEFAULT=${DEFAULT/ $p / }; done
          PROFILES=${PROFILES// /}
          PROFILES=${PROFILES:-$(echo $DEFAULT | tr ' ' ',')}
          out=""
          for p in ${PROFILES//,/ }; do
            case " $ALL " in
              *" $p "*) out+="${out:+,}\"$p\"" ;;
              *) echo "::error::profiles: no profile is named '$p'; the profiles are ${ALL% }"; exit 1 ;;
            esac
          done
          echo "profiles=[$out]" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Profiles | ${PROFILES//,/, } |"
            echo "| Server | ${SERVER:-docker (default)} |"
          } >> "$GITHUB_STEP_SUMMARY"

  use-case:
    needs: plan
    strategy:
      # whole number from 1
      max-parallel: 1
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.profiles) }}
    name: use-case (${{ matrix.profile }})
    runs-on: [self-hosted, vllm]
    concurrency:
      group: k80-hardware
      cancel-in-progress: false
    # whole minutes from 1
    timeout-minutes: 90
    env:
      # URL of an ollama server
      JUDGE_BASE_URL: ${{ vars.JUDGE_BASE_URL || 'http://localhost:11434' }}
      # a model name on the JUDGE_BASE_URL server, as ollama lists it
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'ornith-1.5:9b' }}
      # a host directory path
      VLLM_LOG_DIR: /tmp/k80-ci-logs
      # whole °C from 1, below TEST_STOP_TEMP
      TEST_START_TEMP: ${{ vars.TEST_START_TEMP || '60' }}
      # whole °C above TEST_START_TEMP
      TEST_STOP_TEMP: ${{ vars.TEST_STOP_TEMP || '80' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: ./.github/actions/test
        with:
          test: use-case-${{ matrix.profile }}
          profile: ${{ matrix.profile }}
          # docker or local; empty = docker
          server: ${{ inputs.server || vars.TEST_SERVER }}
          # prompt names in docker/k80/ci/tests/prompts.yaml, comma separated
          prompt: speech-rewrite
      - uses: ./.github/actions/test-end
        if: always()

  summary:
    needs: [plan, use-case]
    if: ${{ always() && needs.plan.result == 'success' }}
    name: summary
    runs-on: [self-hosted, vllm]
    # whole minutes from 1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: ./.github/actions/setup-tests
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          pattern: "*-report"
          path: docker/k80/ci/tests/reports
      - name: Summary
        working-directory: docker/k80/ci/tests
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: npx tsx summary.ts --input reports
