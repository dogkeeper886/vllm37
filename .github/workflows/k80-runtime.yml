name: K80 Runtime Smoke Test

on:
  workflow_dispatch:
    inputs:
      tp_size:
        description: "Tensor parallel size (1=single GPU die; higher = multi-die, power-risky)"
        required: false
        default: "1"
        type: string
      model:
        description: "Model to serve"
        required: false
        default: "Qwen/Qwen3-0.6B"
        type: string
      attention_backend:
        description: "Attention backend (TORCH_SDPA for a regression comparison)"
        required: false
        default: "XFORMERS"
        type: choice
        options: [XFORMERS, TORCH_SDPA]
      k80_trace:
        description: "Enable VLLM_K80_TRACE=1 for TP-init hang diagnosis logs"
        required: false
        default: "1"
        type: string
      builder_image:
        description: "Builder image, used only if the runtime image must be rebuilt"
        required: false
        default: "vllm37-builder:latest"
        type: string
  workflow_call:
    inputs:
      tp_size:
        required: false
        default: "1"
        type: string
      model:
        required: false
        default: "Qwen/Qwen3-0.6B"
        type: string
      attention_backend:
        required: false
        default: "XFORMERS"
        type: string
      k80_trace:
        required: false
        default: "1"
        type: string
      builder_image:
        required: false
        default: "vllm37-builder:latest"
        type: string
    outputs:
      result:
        description: "Runtime smoke test result"
        value: ${{ jobs.runtime.outputs.result }}

concurrency:
  group: k80-hardware
  cancel-in-progress: false

jobs:
  runtime:
    name: Container smoke test
    runs-on: [self-hosted, vllm]
    # Covers a runtime image rebuild (~15 min), model download, 10 min boot
    # wait and the smoke request; a hang releases the k80-hardware lock.
    timeout-minutes: 45
    env:
      TP_SIZE: ${{ inputs.tp_size || '1' }}
      MODEL: ${{ inputs.model || 'Qwen/Qwen3-0.6B' }}
      VLLM_ATTENTION_BACKEND: ${{ inputs.attention_backend || 'XFORMERS' }}
      VLLM_K80_TRACE: ${{ inputs.k80_trace || '1' }}
      BUILDER_IMAGE: ${{ inputs.builder_image || 'vllm37-builder:latest' }}
      VLLM_LOG_DIR: /tmp/k80-ci-logs
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
    outputs:
      result: ${{ steps.smoke.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Ensure runtime image matches branch SHA
        working-directory: docker/k80
        run: ci/ensure-runtime.sh "$BUILDER_IMAGE"

      - name: XFormers cutlassF kernel test (GPU0)
        run: |
          # Runs the patched kernels against an eager reference inside the
          # image that serves, before the server takes the GPU.
          docker run --rm --runtime=nvidia --gpus device=0 \
            -v "${{ github.workspace }}/docker/k80/xformers-build:/t:ro" \
            --entrypoint bash vllm37-local:latest \
            -c 'cd /tmp && timeout 120 python /t/test_cutlass_fp32.py' | tee /tmp/xformers-kernel.log
          grep -qE "^RESULT.*PASS\b" /tmp/xformers-kernel.log

      - name: Prepare log directory
        run: |
          # NCCL_DEBUG_FILE in the container writes into /var/log/vllm, which is
          # bind-mounted from $VLLM_LOG_DIR on the host. Directory must exist
          # and be writable before `compose up` or the mount silently becomes
          # root-owned empty dir and NCCL cannot write.
          mkdir -p "$VLLM_LOG_DIR"
          chmod 777 "$VLLM_LOG_DIR"

      - name: Start vLLM container
        working-directory: docker/k80
        run: |
          echo "Starting vLLM: TP_SIZE=$TP_SIZE MODEL=$MODEL VLLM_ATTENTION_BACKEND=$VLLM_ATTENTION_BACKEND VLLM_K80_TRACE=$VLLM_K80_TRACE"
          $COMPOSE up -d
          $COMPOSE ps

      - name: Wait for server ready
        working-directory: docker/k80
        run: |
          if ! ci/wait-ready.sh 600; then
            echo "::error::Server did not become ready."
            $COMPOSE logs --no-color --tail 200
            exit 1
          fi

      - name: Assert attention backend
        working-directory: docker/k80
        run: |
          case "$VLLM_ATTENTION_BACKEND" in
            XFORMERS)   EXPECT="Using XFormers attention backend" ;;
            TORCH_SDPA) EXPECT="Using Torch SDPA attention backend" ;;
            *) echo "::error::Unknown attention backend $VLLM_ATTENTION_BACKEND"; exit 1 ;;
          esac
          LINE=$($COMPOSE logs --no-color | grep -m1 "attention backend" || true)
          echo "Selected: ${LINE:-<no backend line>}"
          if ! grep -qF "$EXPECT" <<<"$LINE"; then
            echo "::error::Expected '$EXPECT'."
            exit 1
          fi

      - name: Smoke test — /v1/completions
        id: smoke
        run: |
          RESP=$(curl -fsS --max-time 60 http://localhost:8000/v1/completions \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"$MODEL\",\"prompt\":\"Hello\",\"max_tokens\":16,\"temperature\":0}")
          echo "--- response ---"
          echo "$RESP"

          TEXT=$(echo "$RESP" | jq -r '.choices[0].text')
          FINISH=$(echo "$RESP" | jq -r '.choices[0].finish_reason')
          COMPLETION_TOKENS=$(echo "$RESP" | jq -r '.usage.completion_tokens')

          if [ -z "$TEXT" ] || [ "$TEXT" = "null" ]; then
            echo "::error::Response missing choices[0].text"
            exit 1
          fi

          GOLDEN=docker/k80/ci/golden.json
          GOLDEN_MODEL=$(jq -r '.applies_when.model' "$GOLDEN")
          GOLDEN_TP=$(jq -r '.applies_when.tp_size' "$GOLDEN")
          if [ "$MODEL" = "$GOLDEN_MODEL" ] && [ "$TP_SIZE" = "$GOLDEN_TP" ]; then
            EXPECT_TEXT=$(jq -r '.expected.text' "$GOLDEN")
            EXPECT_TOKENS=$(jq -r '.expected.completion_tokens' "$GOLDEN")
            EXPECT_FINISH=$(jq -r '.expected.finish_reason' "$GOLDEN")
            FAIL=0
            if [ "$TEXT" != "$EXPECT_TEXT" ]; then
              echo "::error::Golden text mismatch"
              echo "  expected: $(printf %q "$EXPECT_TEXT")"
              echo "  actual:   $(printf %q "$TEXT")"
              FAIL=1
            fi
            if [ "$COMPLETION_TOKENS" != "$EXPECT_TOKENS" ]; then
              echo "::error::completion_tokens mismatch (expected=$EXPECT_TOKENS actual=$COMPLETION_TOKENS)"
              FAIL=1
            fi
            if [ "$FINISH" != "$EXPECT_FINISH" ]; then
              echo "::error::finish_reason mismatch (expected=$EXPECT_FINISH actual=$FINISH)"
              FAIL=1
            fi
            if [ "$FAIL" = "1" ]; then
              echo "::notice::To regenerate the golden, see $GOLDEN _comment field."
              exit 1
            fi
            echo "Golden baseline match: text, completion_tokens, finish_reason all as expected."
          else
            echo "MODEL=$MODEL TP_SIZE=$TP_SIZE does not match golden (model=$GOLDEN_MODEL tp=$GOLDEN_TP) — skipping baseline check."
          fi

      - name: Capture container logs
        if: always()
        working-directory: docker/k80
        run: |
          mkdir -p "$VLLM_LOG_DIR"
          $COMPOSE logs --no-color > "$VLLM_LOG_DIR/vllm.log" 2>&1 || true
          cp /tmp/xformers-kernel.log "$VLLM_LOG_DIR/" 2>/dev/null || true
          tail -200 "$VLLM_LOG_DIR/vllm.log" || true

      - name: Tear down container
        if: always()
        working-directory: docker/k80
        run: $COMPOSE down -v || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: k80-runtime-logs
          path: /tmp/k80-ci-logs/
