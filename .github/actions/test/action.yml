name: Test
description: >
  The steps of a test run, up to and including the test: the host, node, the
  runtime check, the judge check, the server start and the test itself.
  Always follow it with the test-end action under `if: always()`, which stops
  the server, gives the GPUs back and judges the replies. The job that uses
  this sets the runner, the k80-hardware lock, the time limit, the judge
  settings (JUDGE_BASE_URL, JUDGE_MODEL) and the die temperatures
  (TEST_START_TEMP, TEST_STOP_TEMP), which an action cannot set.

  One question for every run: under the condition the inputs set, does vllm37
  still give a real answer and not garbage?

inputs:
  test:
    description: "Name shown in the report"
    required: true
  profile:
    description: "Model profile, a name in docker/k80/models/. Empty = qwen3-0.6b, the baseline, with model, dtype, dies and max_model_len below as overrides; a named profile serves as written and leaves those four out"
    default: ""
  server:
    description: "Build to serve: docker = the image on the runner, local = the host build (empty = docker)"
    default: ""
  model:
    description: "Hugging Face model id (empty = the default in service-start.sh)"
    default: ""
  dtype:
    description: "Weight and KV cache dtype, such as float32 or half"
    default: "float32"
  dies:
    description: "Dies (tensor parallel size): any count the host has, GPU0 first"
    default: "1"
  max_model_len:
    description: "Context length in tokens (empty = the default in service-start.sh)"
    default: ""
  prompt:
    description: "Prompt from prompts.yaml; a comma list runs each"
    default: "speech-rewrite"
  calls:
    description: "Calls that send the prompt at once; a comma list runs each"
    default: "1"
  stagger:
    description: "Tokens a call has streamed before the next is sent (0 = together); a comma list runs each"
    default: "0"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TEST: ${{ inputs.test }}
        REPORT: ${{ inputs.profile && format('{0}-report', inputs.test) || format('{0}-{1}-{2}die-report', inputs.test, inputs.dtype, inputs.dies) }}
      run: |
        echo "TEST_NAME=$TEST" >> "$GITHUB_ENV"
        echo "TEST_REPORT=$REPORT" >> "$GITHUB_ENV"
    - uses: ./.github/actions/identify-host
      if: ${{ success() && !cancelled() }}
    - uses: ./.github/actions/setup-tests
      if: ${{ success() && !cancelled() }}
    - name: Runtime
      if: ${{ success() && !cancelled() }}
      shell: bash
      env:
        SERVER: ${{ inputs.server }}
      run: docker/k80/ci/runtime.sh "$SERVER"
    - name: Judge ready
      if: ${{ success() && !cancelled() }}
      shell: bash
      working-directory: docker/k80/ci/tests
      run: npx tsx report.ts --ready
    - name: Service start
      if: ${{ success() && !cancelled() }}
      shell: bash
      env:
        SERVER: ${{ inputs.server }}
        PROFILE: ${{ inputs.profile }}
        MODEL: ${{ !inputs.profile && inputs.model || '' }}
        DTYPE: ${{ !inputs.profile && inputs.dtype || '' }}
        TP_SIZE: ${{ !inputs.profile && inputs.dies || '' }}
        MAX_MODEL_LEN: ${{ !inputs.profile && inputs.max_model_len || '' }}
      run: docker/k80/ci/service-start.sh "$SERVER"
    - name: Test
      if: ${{ success() && !cancelled() }}
      shell: bash
      working-directory: docker/k80/ci/tests
      env:
        TEST: ${{ inputs.test }}
        PROMPT: ${{ inputs.prompt }}
        CALLS: ${{ inputs.calls }}
        STAGGER: ${{ inputs.stagger }}
        DIES: ${{ inputs.dies }}
        # docker or local; empty = docker
        SERVER: ${{ inputs.server }}
        PROFILE: ${{ inputs.profile }}
        MODEL: ${{ !inputs.profile && inputs.model || '' }}
        DTYPE: ${{ !inputs.profile && inputs.dtype || '' }}
        TP_SIZE: ${{ !inputs.profile && inputs.dies || '' }}
        MAX_MODEL_LEN: ${{ !inputs.profile && inputs.max_model_len || '' }}
      # TEST_START_TEMP: whole °C from 1, below TEST_STOP_TEMP; empty = 60.
      # TEST_STOP_TEMP: whole °C above TEST_START_TEMP; empty = 80.
      run: >-
        npx tsx test.ts --test "$TEST" --prompt "$PROMPT" --calls "$CALLS" --stagger "$STAGGER"
        --dies "${VLLM37_DIES:-$DIES}" --start-temp "${TEST_START_TEMP:-}" --stop-temp "${TEST_STOP_TEMP:-}"
        --server "${SERVER:-docker}" --output results/replies.json
